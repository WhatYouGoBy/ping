name: container

on:
  # Called by the Deploy workflow once semantic-release cuts a version, so the
  # image is tagged with that version. A tag-push trigger would not fire:
  # tags pushed with the default GITHUB_TOKEN do not retrigger workflows.
  workflow_call:
    inputs:
      version:
        description: Image tag to publish (the semantic-release version)
        required: true
        type: string
  # Manual runs still work; pass any tag, e.g. "test".
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        # GHCR requires a lowercase image name. github.repository keeps the
        # owner's casing, so lower it here and reuse it for the tags.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
